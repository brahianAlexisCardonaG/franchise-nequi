server:
  port: 8085
spring:
  application:
    name: franchise
  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5432/franchise}
    username: ${SPRING_R2DBC_USERNAME:franchise}
    password: ${SPRING_R2DBC_PASSWORD:change-me}
  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:never}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
logging:
  level:
    org.springframework.web.reactive.function.server: INFO
springdoc:
  pre-loading-enabled: true
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
resilience4j:
  circuitbreaker:
    instances:
      persistence:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exceptions:
          - org.springframework.dao.DataIntegrityViolationException
persistence:
  resilience:
    circuit-breaker-name: persistence
    timeout: 2s
    max-retries: 2
    retry-min-backoff: 200ms
    read-prefetch: 64
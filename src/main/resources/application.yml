server:
  port: 8085
spring:
  application:
    name: franchise
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/franchise?sslmode=require
    username: postgres
    password: Maddy-2026
  sql:
    init:
      mode: never
  logging:
    level:
      org.springframework.web.reactive.function.server: DEBUG
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
resilience4j:
  circuitbreaker:
    instances:
      persistence:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exceptions:
          - org.springframework.dao.DataIntegrityViolationException
persistence:
  resilience:
    circuit-breaker-name: persistence
    timeout: 2s
    max-retries: 2
    retry-min-backoff: 200ms
    read-prefetch: 64